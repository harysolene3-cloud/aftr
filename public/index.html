<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AFTR — La plateforme des DJs</title>
  <meta name="description" content="AFTR connecte la culture musicale, la communauté et le business des DJs.">
  <script>
    // Applique le thème enregistré avant l'affichage (évite le flash clair/sombre)
    (function () {
      var m = document.cookie.match(/(?:^|; )aftr_theme=(\w+)/), t = m ? m[1] : 'auto';
      if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/aftr.css">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="demo-strip" role="note">Projet étudiant INSEEC, démo sans vente réelle</div>
  <div id="root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
